[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "messages"
version = "0.1.0"
description = "Draft-first personal Telegram assistant"
requires-python = ">=3.11"
dependencies = [
    "Telethon>=1.36,<2",
]

[project.scripts]
messages = "messages.app:main"

[tool.setuptools.packages.find]
where = ["src"]

